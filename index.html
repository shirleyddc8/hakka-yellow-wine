<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakka Yellow Wine | Home</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Roboto+Serif:opsz,wght@8..144,400;8..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --font-nav: 'Roboto Serif', serif;
            --font-text: 'Roboto', sans-serif;
            --font-header: 'Roboto Serif', serif;
            --color-text: #2c2c2c;
            --color-accent: #8b2522; 
        }

        /* --- GLOBAL RESET --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-text);
            color: var(--color-text);
            background-color: #fdfbf7; 
            overflow-x: hidden;
        }

        /* --- BULLETPROOF GLOBAL BACKGROUND --- */
        .global-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('images/background.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -10; 
            pointer-events: none;
        }

        /* --- NAVIGATION --- */
        .top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: 8px 40px; 
            background-color: rgba(253, 251, 247, 0.85);
            border-bottom: none; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-nav::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('images/sunrise.png');
            background-size: cover;
            background-position: center top;
            opacity: 0.5;
            z-index: -1;
        }

        .nav-brand {
            display: flex;
            align-items: center;
        }

        .nav-logo {
            height: 65px;
            object-fit: contain;
        }

        .top-nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .top-nav a {
            text-decoration: none;
            color: var(--color-accent);
            font-family: var(--font-nav);
            font-size: 24px;
            transition: opacity 0.3s ease;
            font-weight: 700;
        }

        .top-nav a:hover, .top-nav a.active {
            opacity: 0.7;
        }

        /* --- HERO SECTION --- */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            background-color: transparent; 
        }

        /* Rice Field */
        .rice-field {
            position: absolute;
            bottom: -5vh; 
            left: 0; 
            right: auto;
            width: 100%; 
            height: 35vh; 
            object-fit: cover;
            object-position: left top;
            z-index: 15; 
            opacity: 0;
            pointer-events: none;
        }

        /* Wine Bottles Image */
        .wine-bottles {
            position: absolute;
            bottom: 2vh; 
            left: 8%; 
            height: 31vh; 
            width: auto;
            object-fit: contain;
            z-index: 20; 
            opacity: 0; 
            pointer-events: none;
        }

        /* Rice Stalk Container */
        .stalk-container {
            position: absolute;
            left: -1%; 
            bottom: 0;
            height: 70vh; 
            z-index: 25; 
            transform-origin: bottom center;
            opacity: 0; 
            pointer-events: none; 
        }

        .rice-stalk {
            height: 100%;
            width: auto;
            object-fit: contain;
            transform-origin: bottom left;
            animation: sway 6s ease-in-out infinite alternate;
        }

        /* --- ANIMATION LAYERS --- */
        .animation-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            align-items: flex-start; 
            justify-content: center;
            padding-top: 130px; 
        }

        .intro-sequence {
            position: absolute;
            top: 80px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 40; 
            width: 100%;
        }

        .ripple-circle {
            position: absolute;
            top: 40%;
            left: 50%;
            width: 150px;
            height: 150px;
            background: rgba(253, 251, 247, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.7), inset 0 0 60px rgba(255, 255, 255, 0.7); 
            border-radius: 50%;
